name: Static Types Checker.

on:
  pull_request:
    branches: [ "*" ]
  push:
    branches: [ "main" ]
jobs:
  mypy:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.13", "3.14" ]
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            **/typing_requirements.txt
      - name: Install dependencies.
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r typing_requirements.txt
          python -m pip install -e ".[agent,scanner,serve,testing]"
      - name: Running static types checker.
        run: |
          python tools/generate_proto_stubs.py
          git diff --exit-code -- "*_pb2.pyi"
          mypy --python-version ${{ matrix.python-version }}
