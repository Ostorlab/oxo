syntax = "proto2";

import "ostorlab/agent/message/proto/v3/asset/domain_name/domain_name.proto";

package ostorlab.agent.message.proto.v3.history.request.dns;

// The DNS history of a domain name to read.
message Message {
  oneof asset {
    ostorlab.agent.message.proto.v3.asset.domain_name.Message domain_name = 1;
  }
  optional string start = 2;  // ISO 8601 UTC; unset: the whole history
}
