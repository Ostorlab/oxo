syntax = "proto2";

package ostorlab.agent.message.proto.v3.fingerprint.file.harmonyos.metadata;

// A permission requested in the module.json requestPermissions of a HarmonyOS application.
message Permission {
    // e.g. "ohos.permission.INTERNET".
    optional string name = 1;
    // Reason shown to the user, as declared, e.g. "$string:reason_camera".
    optional string reason = 2;
    // usedScene abilities and when ("inuse" or "always").
    repeated string used_scene_abilities = 3;
    optional string used_scene_when = 4;
}

message Message {
    optional string path = 1;
    optional string bundle_name = 2;
    repeated Permission permissions = 3;
    // API levels of the module.json app minAPIVersion and targetAPIVersion, e.g. 12. Versions encoded with the
    // HarmonyOS version, like 50000012 for 5.0.0(12), are reduced to their API level.
    optional int32 min_api_version = 4;
    optional int32 target_api_version = 5;
    // Size in bytes of the file as received (.hap or .app).
    optional int64 size = 6;
    // Lowercase hex digests of the file as received (.hap or .app), e.g. "d41d8cd98f00b204e9800998ecf8427e".
    optional string md5 = 7;
    optional string sha1 = 8;
    optional string sha256 = 9;
    // versionName and versionCode of the app.json app element, e.g. "1.0.0" and 1000000.
    optional string version_name = 10;
    optional int64 version_code = 11;
    // Application label of the app.json app element, with string resources resolved, e.g. "MyApplication".
    optional string label = 12;
}
