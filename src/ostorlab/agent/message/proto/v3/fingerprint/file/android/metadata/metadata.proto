syntax = "proto2";

package ostorlab.agent.message.proto.v3.fingerprint.file.android.metadata;

message IntentFilter {
    optional string action = 1;
    optional string category = 2;
    optional string data = 3;
}

message Permission {
    optional string name = 1;
    repeated string protection_levels = 2;
    optional string permission_group = 3;
}

message Activity {
    optional string name = 1;
    optional string permission = 2;
    optional string process = 3;
    optional bool enabled = 4;
    optional bool exported = 5;
    optional bool direct_boot_aware = 6;
    optional bool allow_task_reparenting = 7;
    repeated IntentFilter intent_filters = 8;
}

message Service {
    optional string name = 1;
    optional string permission = 2;
    optional string description = 3; 
    optional string process = 4;
    optional bool enabled = 5;
    optional bool exported = 6;
    optional string foreground_service_type = 7;
    repeated IntentFilter intent_filters= 8;
}

message Provider {
    optional string name = 1;
    optional string permission = 2;
    optional string process = 3;
    optional bool enabled = 4;
    optional bool exported = 5;
    optional bool syncable = 6;
    repeated string authorities = 7;  
    repeated IntentFilter intent_filters= 8;
}
        
message Receiver {
    optional string name = 1;
    optional string permission = 2;
    optional string process = 3;
    optional bool enabled = 4;
    optional bool exported = 5;
    optional bool direct_boot_aware = 6;
    repeated IntentFilter intent_filters= 7;
}


// An APK signing certificate. Dates are ISO 8601 and fingerprints are colon separated hex, e.g. "AB:CD:...".
message SigningCertificate {
    optional string subject = 1;
    optional string issuer = 2;
    optional string serial_number = 3;
    optional string sha256_fingerprint = 4;
    optional string sha1_fingerprint = 5;
    optional string not_valid_before = 6;
    optional string not_valid_after = 7;
}

message Message {
    optional string path = 1;
    optional string package_name = 2;
    repeated Permission permissions = 3;
    repeated Activity activities = 4;
    repeated Service services = 5;
    repeated Provider providers = 6;
    repeated Receiver receivers = 7;
    // Declared android:minSdkVersion and android:targetSdkVersion of the manifest uses-sdk element.
    optional int32 min_sdk_version = 8;
    optional int32 target_sdk_version = 9;
    // APK signature schemes the application is signed with: "v1", "v2" or "v3".
    repeated string signature_schemes = 10;
    repeated SigningCertificate signing_certificates = 11;
}
