syntax = "proto2";

package ostorlab.agent.message.proto.v3.fingerprint.store.android;

// A data type of the Google Play data safety section, e.g. category "Location", data type "Approximate location".
message DataSafetyItem {
  optional string category = 1;
  optional string data_type = 2;
  optional bool is_optional = 3;
  repeated string purposes = 4;
}

// The Google Play data safety section of the application.
message DataSafety {
  optional string url = 1;
  repeated DataSafetyItem data_shared = 2;
  repeated DataSafetyItem data_collected = 3;
  repeated string security_practices = 4;
}

// Google Play store listing of an Android application.
message Message {
  optional string package_name = 1;
  optional string name = 2;
  optional string icon_url = 3;
  optional string category = 4;
  optional double rating = 5;
  optional int64 rating_count = 6;
  // Install range as displayed by the store, e.g. "10,000,000+".
  optional string installs = 7;
  // ISO 8601 date, e.g. "2010-10-18".
  optional string release_date = 8;
  // ISO 8601 UTC timestamp, e.g. "2026-10-26T12:28:55Z".
  optional string last_update_date = 9;
  optional string version = 10;
  optional double price = 11;
  optional string currency = 12;
  optional bool has_in_app_purchases = 13;
  optional string content_rating = 14;
  optional string description = 15;
  repeated string screenshot_urls = 16;
  optional string privacy_policy_url = 17;
  optional string store_url = 18;
  optional DataSafety data_safety = 19;
  // Developer name, contact email and website as listed on the store page, e.g. "Example Inc.",
  // "support@example.com" and "https://example.com".
  optional string developer = 20;
  optional string developer_email = 21;
  optional string developer_url = 22;
}
