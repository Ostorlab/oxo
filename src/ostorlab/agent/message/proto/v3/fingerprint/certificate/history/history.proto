syntax = "proto2";

import "ostorlab/agent/message/proto/common/x509/x509.proto";

package ostorlab.agent.message.proto.v3.fingerprint.certificate.history;

// A certificate logged in Certificate Transparency.
message Certificate {
  // The crt.sh id of the certificate, whose page is https://crt.sh/?id={crtsh_id}.
  optional uint64 crtsh_id = 1;
  // The names the certificate covers: for a domain, the domain and its subdomains; for an IP, every name and address on it.
  repeated string names = 6;
  // The certificate read from crt.sh, described as the certificate fetcher describes a certificate a server serves.
  optional ostorlab.agent.message.proto.common.x509.X509Cert x509 = 7;
}

// The certificates an issuer gave to the host, and for a domain to its subdomains.
message Issuer {
  // The issuer distinguished name.
  optional string name = 1;
  // When its first certificate became valid, as an ISO 8601 date and time in UTC.
  optional string first_issued = 2;
  // When its last certificate became valid, as an ISO 8601 date and time in UTC.
  optional string last_issued = 3;
  optional uint32 certificate_count = 4;
}

// The certificates of a domain or an IP logged in Certificate Transparency, from crt.sh.
message Message {
  // The host: a registrable domain name, an IPv4 or an IPv6 address.
  optional string host = 1;
  // How many certificates the host has, each counted once, 0 when none; for a domain, its subdomains' included.
  optional uint32 certificate_count = 2;
  // How many of them cover the host itself; for an IP, all of them.
  optional uint32 host_certificate_count = 3;
  // When the first certificate became valid, as an ISO 8601 date and time in UTC; absent when there is none.
  optional string first_issued = 4;
  // When the last certificate became valid, as an ISO 8601 date and time in UTC; absent when there is none.
  optional string last_issued = 5;
  repeated Issuer issuers = 6;
  // The latest certificates covering the host itself, newest first; host_certificate_count is how many there are in all.
  repeated Certificate certificates = 7;
  // When crt.sh last read the Certificate Transparency logs, as an ISO 8601 date and time in UTC; later certificates are missing.
  optional string data_up_to = 8;
  // Whether every certificate was fetched; false when some expiry ranges timed out.
  optional bool complete = 9;
  // The expiry ranges that were not fetched, as ISO 8601 intervals like 2021-01-01/2022-01-01.
  repeated string missing_ranges = 10;
  // The crt.sh search page of the host.
  optional string search_url = 11;
}
