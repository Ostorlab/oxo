syntax = "proto2";

package ostorlab.agent.message.proto.v3.asset.asn.whois;

message Message {
  optional string asn = 1;
  optional string name = 2;
  optional string org = 3;
  optional string country_code = 4;
  optional string registry = 5;
  optional string allocated_date = 6;
  optional string updated_date = 7;
  optional string rdap_url = 8;
}
