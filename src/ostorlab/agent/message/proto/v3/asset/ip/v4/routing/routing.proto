syntax = "proto2";

package ostorlab.agent.message.proto.v3.asset.ip.v4.routing;

// An ASN that announces the prefix in BGP, with the RPKI validity of that announcement.
message Origin {
  optional string asn = 1;
  // valid, invalid_asn, invalid_length or unknown.
  optional string rpki_status = 2;
}

message Message {
  optional string host = 1;
  optional string mask = 2;
  optional int32 version = 3 [default = 4];
  // The most specific announced prefix that contains the IP.
  optional string prefix = 4;
  repeated Origin origins = 5;
}
