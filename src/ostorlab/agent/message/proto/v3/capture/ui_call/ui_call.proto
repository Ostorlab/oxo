syntax = "proto2";

package ostorlab.agent.message.proto.v3.capture.ui_call;

message Message{
    optional string path = 1; 
    optional string dna = 2;
    optional bytes screenshot = 3;
    optional string parent_dna = 4;
    // When the page was captured, as an ISO 8601 date and time in UTC, like 2019-01-29T22:43:31Z, for a screenshot
    // of an archived page; absent for a screenshot taken during the scan.
    optional string captured_at = 5;
}
